
name: Publish Coverage Reports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci --prefix "4. backend"

      - name: Install frontend dependencies
        run: npm ci --prefix "3. frontend"

      - name: Generate backend coverage and test results
        run: >
          npm run coverage:backend --
          --json
          --outputFile="$RUNNER_TEMP/backend-test-results.json"

      - name: Generate frontend coverage and test results
        run: >
          npm run coverage:frontend --
          --reporter=json
          --outputFile="$RUNNER_TEMP/frontend-test-results.json"

      - name: Prepare Pages site
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          mkdir -p site/backend site/frontend

          cp -R "4. backend/coverage/lcov-report/." site/backend/
          cp -R "3. frontend/coverage/lcov-report/." site/frontend/

          node scripts/generate-coverage-metadata.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
